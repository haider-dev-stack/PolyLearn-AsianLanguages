<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PolyLearn — East Asian Languages</title>
<meta name="theme-color" content="#1b2a5c">
<meta name="description" content="Learn Japanese, Mandarin, Cantonese, Korean and Thai with phrases, alphabets, listening practice and an AI tutor.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png">
<style>:root{
 --bg:linear-gradient(180deg,#eef1ff,#f7f5ff);--ink:#1c2340;--muted:#5d6688;--card:rgba(255,255,255,.66);--card2:rgba(255,255,255,.9);
 --line:rgba(255,255,255,.75);--edge:rgba(40,50,110,.10);--nav:rgba(255,255,255,.82);--nav-ink:#5d6688;--nav-on:rgba(98,87,232,.14);
 --primary:#6257e8;--on-primary:#fff;--gold:#ffd23f;--on-gold:#2a2100;--good:#18a574;--bad:#e5484d;--track:rgba(40,50,110,.14);
 --shadow:0 10px 30px rgba(39,45,95,.10);--chip:rgba(255,255,255,.55);--field:rgba(255,255,255,.8);
 --good-bg:rgba(24,165,116,.16);--bad-bg:rgba(229,72,77,.15);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;line-height:1.35;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:var(--bg);z-index:-1}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.hidden{display:none!important}
svg{display:block}
.app{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 130px}
body[data-page=practice] .app{padding-bottom:30px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:1.15rem;letter-spacing:-.3px}
.logo{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--primary),#a29aff);color:#fff;font-size:19px;font-weight:700}
.langchip{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:800;font-size:.88rem;box-shadow:var(--shadow)}
.langchip b{font-size:.7rem;letter-spacing:.1em;background:var(--primary);color:var(--on-primary);border-radius:999px;padding:2px 7px}
.langchip svg{width:14px;height:14px;opacity:.7}
.hello{font-size:1.55rem;font-weight:900;letter-spacing:-.6px;margin:2px 2px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pad{padding:18px}
.muted{color:var(--muted)}
.small{font-size:.82rem}
/* gauge */
.gauge{padding:14px 14px 16px;margin-bottom:18px}
.arc{position:relative;width:min(300px,100%);margin:0 auto}
.arc svg{width:100%;height:auto}
.arc .num{position:absolute;left:0;right:0;top:46%;display:flex;align-items:center;justify-content:center;gap:6px;font-size:2.3rem;font-weight:900;color:#f2a900}
.arc .num svg{width:30px;height:30px;color:#f2a900}
.arc .sub{position:absolute;left:0;right:0;top:78%;text-align:center;font-size:.78rem;font-weight:700;color:var(--muted)}
.gstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.gs{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:16px;font-weight:800;font-size:.82rem;text-align:center}
.gs:active{background:var(--nav-on)}
.gs i{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;color:#fff}
.gs i svg{width:21px;height:21px}
.gs small{font-weight:600;font-size:.7rem;color:var(--muted)}
/* units */
.unit{margin-bottom:16px}
.unit-h{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font-weight:900;font-size:1.1rem;padding:6px 0 10px}
.unit-h svg{width:18px;height:18px;transition:transform .2s}
.unit.closed .unit-h svg{transform:rotate(-90deg)}
.unit.closed .ugrid{display:none}
.ugrid{display:grid;grid-template-columns:1fr 1fr;gap:18px 8px;padding:20px 12px 16px}
.node{display:flex;flex-direction:column;align-items:center;gap:9px;font-weight:800;font-size:1rem}
.ring{--p:0;width:min(150px,38vw);aspect-ratio:1;border-radius:50%;padding:7px;background:conic-gradient(var(--ringc,#f5b800) calc(var(--p)*1turn),var(--track) 0);display:grid;place-items:center;transition:transform .15s}
.node:active .ring{transform:scale(.96)}
.disc{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;color:#fff;border:5px solid var(--ring-bg,rgba(255,255,255,.65));box-shadow:inset 0 -8px 18px rgba(0,0,0,.12)}
.disc svg{width:46%;height:46%;stroke-width:1.7}
.disc .gl{font-size:clamp(2rem,10vw,3.1rem);font-weight:800;line-height:1}
.nl{text-align:center;line-height:1.15;max-width:150px}
/* page header */
.ph{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:6px;margin-bottom:12px}
.iconbtn{display:grid;place-items:center;width:42px;height:42px;border-radius:50%}
.iconbtn:active{background:var(--nav-on)}
.iconbtn svg{width:24px;height:24px}
.ph h1{font-size:1.3rem;font-weight:900;text-align:center;letter-spacing:-.3px}
.stars{display:flex;gap:2px;color:#f5b800}
.stars svg{width:26px;height:26px;fill:currentColor;stroke:currentColor;stroke-width:1}
.stars .off{color:var(--track)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px;gap:4px;margin-bottom:12px;box-shadow:var(--shadow)}
.seg button{flex:1;display:grid;place-items:center;padding:11px 6px;border-radius:999px;font-weight:800;color:var(--muted)}
.seg button.on{background:var(--primary);color:var(--on-primary)}
.seg svg{width:22px;height:22px}
.toolrow{display:flex;gap:8px;align-items:center;justify-content:center;margin:0 0 12px;flex-wrap:wrap}
.pillbtn{display:flex;align-items:center;gap:7px;background:var(--card2);border:2px solid var(--edge);border-radius:999px;padding:9px 16px;font-weight:800;font-size:.92rem}
.pillbtn.on{border-color:var(--primary);background:var(--nav-on)}
.pillbtn svg{width:18px;height:18px}
/* word list */
.wlist{display:grid;gap:10px}
.wcard{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.wrow{display:flex;gap:10px;align-items:center;justify-content:space-between}
.wn{font-size:1.4rem;font-weight:900;line-height:1.2;overflow-wrap:anywhere}
.wr{font-style:italic;font-weight:700;font-size:1.05rem;margin-top:2px;overflow-wrap:anywhere}
.we{font-weight:800;color:var(--primary);font-size:1.12rem;margin-top:1px}
.wacc{min-width:86px;text-align:right;font-weight:800;font-size:.92rem;white-space:nowrap}
.wacc .ok{color:var(--good)}.wacc .no{color:var(--bad);margin-left:7px}
.abar{display:flex;height:5px;border-radius:9px;background:var(--track);margin-top:5px;overflow:hidden;min-width:82px}
.abar i{display:block;background:var(--good)}.abar b{display:block;background:var(--bad)}
.wmore{margin-top:10px;padding-top:10px;border-top:1px dashed var(--edge);font-size:.92rem;color:var(--muted)}
.wmore .acts{display:flex;gap:8px;margin-top:10px}
.mini{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:var(--card2);border:1px solid var(--edge);font-weight:800;font-size:.85rem;color:var(--ink)}
.mini svg{width:17px;height:17px}
.mini.fav{color:#c98a00}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-weight:700}
/* dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:min(560px,calc(100% - 24px));display:flex;gap:10px;align-items:center;background:var(--nav);border-radius:40px;padding:8px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 12px 34px rgba(20,25,60,.25);z-index:20}
.btn-go{flex:1;background:var(--gold);color:var(--on-gold);font-weight:900;font-size:1.35rem;border-radius:32px;padding:15px 12px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.btn-go:active{transform:translateY(2px)}
.btn-play{flex:none;width:60px;height:60px;border-radius:50%;background:#e24a60;color:#ffd23f;display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.14)}
.btn-play svg{width:28px;height:28px;fill:currentColor}
.btn-play.on{background:var(--primary);color:var(--on-primary)}
.peek{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(14px,env(safe-area-inset-bottom)) + 82px);width:min(560px,calc(100% - 24px));z-index:19;display:flex;gap:14px;align-items:center;padding:12px 16px;background:var(--card2);border:1px solid var(--edge);border-radius:24px;box-shadow:0 10px 30px rgba(20,25,60,.22)}
.peek .pg{font-size:2.6rem;font-weight:800;line-height:1;min-width:66px;text-align:center}
.peek .pt{flex:1;min-width:0}.peek .pt b{display:block;font-size:1.1rem}.peek .pt span{display:block;font-size:.84rem;color:var(--muted);line-height:1.3}
.peek button{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--primary);color:var(--on-primary)}
.peek button svg{width:24px;height:24px}
/* tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:min(560px,calc(100% - 24px));display:flex;justify-content:space-between;gap:2px;background:var(--nav);border-radius:40px;padding:7px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 12px 34px rgba(20,25,60,.25);z-index:20}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;border-radius:30px;color:var(--nav-ink);font-size:.66rem;font-weight:800}
.tb svg{width:25px;height:25px}
.tb.on{background:var(--nav-on);color:var(--primary)}
/* script grid */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -16px 4px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;background:var(--chip);border:1.5px solid var(--edge);border-radius:999px;padding:9px 14px;font-weight:800;font-size:.88rem;white-space:nowrap}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.chip i{font-style:normal;font-size:.72rem;opacity:.75}
.gdesc{font-size:.86rem;color:var(--muted);margin:2px 2px 12px;line-height:1.4}
.sgrid{display:grid;gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:76px;padding:8px 2px;border-radius:18px;background:var(--card);border:1.5px solid var(--line);box-shadow:0 4px 14px rgba(39,45,95,.07);text-align:center}
.tile.empty{visibility:hidden}
.tile.on{border-color:var(--primary);background:var(--card2);box-shadow:0 0 0 3px var(--nav-on)}
.tile b{font-size:1.65rem;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.tile.wide b{font-size:1.2rem}
.tile small{font-size:.7rem;color:var(--muted);font-weight:700;line-height:1.15;overflow-wrap:anywhere;padding:0 2px}
.tile .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
/* practice */
.prac{display:flex;flex-direction:column;min-height:calc(100vh - 30px)}
.ptop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pbar{flex:1;height:16px;border-radius:99px;background:var(--card2);border:2px solid var(--primary);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s}
.pxp{font-weight:900;font-size:1rem;margin:0 4px 10px auto;display:block;text-align:right}
.pq{padding:16px 18px;margin-bottom:22px;display:flex;align-items:center;gap:14px;min-height:88px}
.pq h2{font-size:1.45rem;font-weight:900;letter-spacing:-.4px;flex:1}
.pq .big{font-size:clamp(2.2rem,9vw,3.2rem);font-weight:900;line-height:1.15;text-align:center;flex:1;overflow-wrap:anywhere}
.pq .big small{display:block;font-size:1.05rem;font-style:italic;font-weight:700;color:var(--muted);margin-top:4px}
.pq .lab{font-size:.82rem;font-weight:800;color:var(--muted);display:block;margin-bottom:2px}
.sbtn{flex:none;width:58px;height:58px;border-radius:50%;background:#e24a60;color:#ffd23f;display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.14)}
.sbtn svg{width:28px;height:28px;fill:currentColor}
.popts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:118px;padding:14px 8px;border-radius:30px;background:var(--card);border:2.5px solid var(--line);box-shadow:var(--shadow);text-align:center}
.opt .og{font-size:2.5rem;font-weight:900;line-height:1.1;overflow-wrap:anywhere}
.opt .og.sm{font-size:1.5rem}
.opt .or{font-style:italic;font-weight:700;font-size:1.02rem;overflow-wrap:anywhere}
.opt .ot{font-weight:800;font-size:1.12rem;overflow-wrap:anywhere;line-height:1.25}
.opt.good{border-color:var(--good);background:var(--good-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.pfoot{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:16px 16px max(18px,env(safe-area-inset-bottom));border-radius:26px 26px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18)}
.pfoot .in{max-width:560px;margin:0 auto}
.pfoot.good{background:#d6f5e6;color:#0b5b3f}.pfoot.bad{background:#fde0e1;color:#8c1d22}
.pfoot h3{font-size:1.3rem;font-weight:900;margin-bottom:2px}
.pfoot p{font-weight:700;font-size:.98rem;margin-bottom:12px}
.pfoot button{width:100%;padding:15px;border-radius:30px;font-weight:900;font-size:1.1rem;color:#fff}
.pfoot.good button{background:var(--good)}.pfoot.bad button{background:var(--bad)}
.tinput{width:100%;padding:16px;border-radius:22px;border:2.5px solid var(--edge);background:var(--field);font-size:1.2rem;font-weight:700;text-align:center;outline:none}
.tinput:focus{border-color:var(--primary)}
.cta{width:100%;background:var(--primary);color:var(--on-primary);padding:15px;border-radius:30px;font-weight:900;font-size:1.1rem;margin-top:14px}
.cta.alt{background:var(--card2);color:var(--ink);border:2px solid var(--edge)}
.res{text-align:center;padding:26px 18px;margin-top:10px}
.res .sc{font-size:3.6rem;font-weight:900;letter-spacing:-2px;margin:6px 0}
.res .xpg{display:inline-block;background:var(--gold);color:var(--on-gold);font-weight:900;border-radius:999px;padding:7px 16px;margin:8px 0 4px}
.rlist{display:grid;gap:8px;margin-top:16px;text-align:left}
.ritem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:var(--card2);border:1px solid var(--edge);width:100%;text-align:left}
.ritem b{font-size:1.2rem}.ritem span{font-weight:700;color:var(--muted);font-size:.88rem;text-align:right}
.flash{padding:26px 16px;text-align:center;min-height:240px;display:grid;place-items:center;cursor:pointer;margin-bottom:18px}
.flash .big{font-size:2.6rem;font-weight:900;line-height:1.2;overflow-wrap:anywhere}
.flash .tip{margin-top:10px;font-weight:700;color:var(--muted)}
.fcrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* stats */
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tile3{padding:14px 12px;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.tile3 b{display:block;font-size:2rem;font-weight:900;line-height:1.1}
.tile3 span{font-weight:700;font-size:.9rem}
.sec{padding:18px;margin-bottom:14px}
.sec h2{font-size:1.25rem;font-weight:900;margin-bottom:6px}
.today{color:#e0a000;font-weight:900;font-size:1.1rem}
.bars{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:170px;margin:16px 0 8px;border-bottom:0}
.bars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bars .b{width:100%;max-width:46px;min-height:6px;border-radius:12px 12px 4px 4px;background:rgba(66,196,255,.45);transition:height .3s}
.bars .b.hit{background:#3dc1ff}
.bars .col.t .b{background:#e0a000}
.bars .goal{position:absolute;left:0;right:0;border-top:2.5px dashed #e0a000;pointer-events:none}
.days{display:flex;justify-content:space-between;gap:8px}
.days span{flex:1;text-align:center;font-weight:800;font-size:.86rem;color:var(--muted)}
.days span.t{color:#e0a000}
.stack{display:flex;height:22px;border-radius:99px;overflow:hidden;background:var(--track);margin:14px 0}
.stack i{display:block}
.leg{display:flex;align-items:center;gap:9px;font-weight:800;margin:9px 0}
.leg u{width:18px;height:18px;border-radius:6px;display:block}
.leg span{flex:1}
.big-n{font-size:2.8rem;font-weight:900;color:#6fbf3b;line-height:1}
.ach{display:flex;gap:14px;align-items:center;padding:14px;border-radius:22px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;box-shadow:var(--shadow)}
.ach i{flex:none;display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--track);color:var(--muted)}
.ach i svg{width:24px;height:24px}
.ach.done i{background:var(--gold);color:var(--on-gold)}
.ach div{flex:1;min-width:0}.ach b{display:block}.ach span{font-size:.85rem;color:var(--muted)}
.ach .pb{height:6px;border-radius:9px;background:var(--track);margin-top:7px;overflow:hidden}.ach .pb i{display:block;width:auto;height:100%;border-radius:0;background:var(--primary)}
.ach em{font-style:normal;font-weight:900;font-size:.8rem;color:var(--good)}
/* leaderboard */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end;margin:18px 0 16px}
.pcol{display:flex;flex-direction:column;align-items:center;min-width:0}
.pcol .nm{font-weight:800;font-size:.95rem;margin:6px 0 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pstep{width:100%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;align-items:center;padding-top:12px;font-weight:900}
.pstep b{font-size:3rem;line-height:1}.pstep span{font-size:.95rem;margin-top:8px;font-weight:800}
.pstep.s1{height:190px;background:linear-gradient(180deg,#ffd30f,rgba(255,211,15,.2));color:#3b2f00}
.pstep.s2{height:150px;background:linear-gradient(180deg,#c9ccd6,rgba(201,204,214,.2));color:#2b2f3d}
.pstep.s3{height:128px;background:linear-gradient(180deg,#ff9f1c,rgba(255,159,28,.2));color:#3a2200}
.avw{position:relative;display:inline-block}
.av{display:inline-grid;place-items:center;border-radius:50%;object-fit:cover;background:#cfd6ff;color:#fff;font-weight:900;width:44px;height:44px;border:3px solid rgba(255,255,255,.85)}
.av.s{width:34px;height:34px;border-width:2px;font-size:.9rem}
.av.m{width:52px;height:52px}
.av.l{width:96px;height:96px;font-size:2.4rem}
.p1 .av{width:96px;height:96px;border-color:#ffd30f;border-width:4px}
.p2 .av{width:76px;height:76px;border-color:#c9ccd6}
.p3 .av{width:68px;height:68px;border-color:#ff9f1c}
.lcode{position:absolute;right:-6px;bottom:-2px;background:var(--primary);color:var(--on-primary);font-size:.6rem;font-weight:900;letter-spacing:.06em;border-radius:8px;padding:2px 5px;border:2px solid #fff}
.lb{display:grid;gap:4px;padding:12px;margin-bottom:12px}
.lbr{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:16px}
.lbr .rk{width:34px;font-size:1.35rem;font-weight:900;text-align:center}
.lbr .tx{flex:1;min-width:0;font-weight:800;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbr.me{background:var(--nav-on)}

/* merge cloud progress into this device without losing either side */
function mergeInto(loc,rem){
 if(!rem||typeof rem!=='object')return loc;
 const o=Object.assign({},loc);
 const mx=(a,b)=>Math.max(+a||0,+b||0),union=(a,b)=>Object.assign({},a||{},b||{});
 o.xp=mx(loc.xp,rem.xp);o.correct=mx(loc.correct,rem.correct);o.answered=mx(loc.answered,rem.answered);o.perfect=mx(loc.perfect,rem.perfect);
 o.mastered=union(rem.mastered,loc.mastered);o.fav=union(rem.fav,loc.fav);
 o.ws=Object.assign({},rem.ws||{});for(const k in (loc.ws||{})){const a=loc.ws[k],b=o.ws[k];if(!b||(a.c+a.w)>(b.c+b.w))o.ws[k]=a}
 for(const f of ['lessons','log']){const r=Object.assign({},rem[f]||{});for(const k in (loc[f]||{}))r[k]=mx(r[k],loc[f][k]);o[f]=r}
 o.studyDays=Array.from(new Set([].concat(loc.studyDays||[],rem.studyDays||[]))).sort();o.lastDay=[loc.lastDay,rem.lastDay].sort().pop()||'';
 o.blocked=union(rem.blocked,loc.blocked);
 /* profile and preferences: the account's saved values win when they exist */
 for(const k of ['name','bio','native','photo','country','lang','theme','accent','goal','romaji','rate','auto','closed','share']){if(rem[k]!==undefined&&rem[k]!==null&&!(k==='name'&&rem[k]==='You'))o[k]=rem[k]}
 if(rem.joined&&rem.joined<loc.joined)o.joined=rem.joined;
 if(!o.daily||o.daily.date!==today())o.daily=loc.daily;
 return o}

let P=null;

const weight=w=>{const k=wkey(w),s=state.ws[k];if(!s)return 3;if(state.mastered[k])return 1;return s.w>s.c?5:2};
function sample(list,n,wt){const pool=list.map(x=>({x:x,w:wt(x)}));const out=[];while(out.length<n&&pool.length){const tot=pool.reduce((a,b)=>a+b.w,0);let r=Math.random()*tot,i=0;for(;i<pool.length;i++){r-=pool[i].w;if(r<=0)break}if(i>=pool.length)i=pool.length-1;out.push(pool[i].x);pool.splice(i,1)}return out}
function wordOpts(w,kind,cat){
 const key=kind==='read'?(x=>x[2]):(x=>x[0]);
 const same=shuf(words(cat)),rest=shuf(L().words);
 const used=new Set([key(w)]),opts=[w];
 same.concat(rest).forEach(x=>{if(opts.length>=4)return;if(used.has(key(x))||(x!==w&&x[2]===w[2]))return;used.add(key(x));opts.push(x)});
 return shuf(opts)}
const hasTTS=()=>'speechSynthesis' in window;
function startWords(cat,mode){
 const list=words(cat);if(!list.length)return;
 stopAll();
 if(mode==='cards'){P={t:'cards',cat:cat,list:shuf(list).slice(0,Math.min(10,list.length)),i:0,shown:false,ok:0,seen:0,done:false,miss:[],max:0};enter();return}
 const kinds=mode==='hear'?['hear']:mode==='type'?['type']:['hear','read','recall'];
 const picks=sample(list,Math.min(10,list.length),weight);
 const qs=picks.map(w=>{let kind=rnd(kinds);if(kind==='hear'&&!hasTTS())kind='read';return {kind:kind,w:w,opts:kind==='type'?null:wordOpts(w,kind,cat)}});
 P={t:'words',cat:cat,mode:mode,qs:qs,i:0,ok:0,ans:null,done:false,miss:[],max:qs.length*3};
 enter();autoPlayQ()}
function reviewList(){return L().words.filter(w=>{const s=state.ws[wkey(w)];return s&&s.w>0&&!state.mastered[wkey(w)]})}

function letterOpts(it,g,type){
 const pool=[];SC.G[state.lang].forEach(x=>{if((x.pool||x.id)===(g.pool||g.id))x.items.forEach(y=>pool.push(y))});
 const key=x=>x.k||x.r,lab=x=>type==='A'?x.c:x.r;
 const keys=new Set([key(it)]),labs=new Set([lab(it)]),opts=[it];
 shuf(pool).forEach(x=>{if(opts.length>=4)return;if(keys.has(key(x))||labs.has(lab(x)))return;keys.add(key(x));labs.add(lab(x));opts.push(x)});
 return shuf(opts)}
function startLetters(item,scope,mode){
 const gs=item.groups.filter(g=>scope==='all'||g.id===scope);if(!gs.length)return;
 stopAll();
 const used=new Set(),qs=[];let guard=0;
 while(qs.length<20&&guard++<4000){
  const g=rnd(gs),free=g.items.filter(x=>!used.has(x));
  if(!free.length){if(gs.every(x=>x.items.every(y=>used.has(y))))used.clear();continue}
  const it=rnd(free);used.add(it);
  const useB=!g.noB&&(mode==='read'||(mode==='mixed'&&Math.random()<.5)),type=useB?'B':'A';
  qs.push({kind:type==='A'?'lhear':'lread',it:it,g:g,opts:letterOpts(it,g,type)})}
 P={t:'letters',item:item,qs:qs,i:0,ok:0,ans:null,done:false,miss:[],max:30};
 enter();autoPlayQ()}

function practiceHTML(){

function showFoot(ok,msg){
 const old=$('pfoot');if(old)old.remove();
 const d=document.createElement('div');d.id='pfoot';d.className='pfoot '+(ok?'good':'bad');
 d.innerHTML='<div class="in"><h3>'+(ok?rnd(['Correct!','Nice one!','Well done!','Perfect!']):'Not quite')+'</h3><p>'+msg+'</p><button data-act="pnext">'+(P.i>=P.qs.length-1?'Finish':'Continue')+'</button></div>';
 document.body.appendChild(d)}
function answerMsg(q){
 if(q.w)return E(q.w[0])+(state.romaji?' ('+E(q.w[1])+')':'')+' = '+E(q.w[2]);
 const it=q.it;return E(it.c)+(it.r!==it.c?' = '+E(it.r):'')+(it.n?' · '+E(it.n):'')}
function finishAnswer(q,ok){
 const key=q.w?wkey(q.w):skey(q.g,q.it);rec(key,ok);
 if(ok)P.ok++;else P.miss.push(q);

 showFoot(ok,ok?answerMsg(q):'Correct answer: '+answerMsg(q));

function pick(i){
 if(!P||P.ans!==null)return;const q=P.qs[P.i];P.ans=i;
 const ok=q.opts[i]===qTarget(q);
 document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(q.opts[k]===qTarget(q))b.classList.add('good');else if(k===i)b.classList.add('bad')});

function typeCheck(skip){
 if(!P||P.ans!==null)return;const q=P.qs[P.i];const inp=$('tin');const a=norm(inp?inp.value:'');
 if(!skip&&!a){toast('Type an answer first');return}

 const ok=!skip&&q.w[2].split('/').map(norm).some(x=>x===a);
 if(inp)inp.disabled=true;

function finishP(){
 const n=P.t==='cards'?P.seen:P.qs.length;P.done=true;
 const per=P.t==='letters'?1.5:3;
 P.xp=P.t==='cards'?0:addXP(P.ok*per);
 state.correct+=P.ok;state.answered+=n;state.daily.quiz+=P.ok;
 if(n>=5){const t=today();state.lessons[t]=(state.lessons[t]||0)+1;if(P.ok===n&&P.t!=='cards')state.perfect++}
 touchDay();save()}
function resultsHTML(){

 who(el){const id=el.dataset.id;if(!id)return;const x=boardRows().find(r=>r.id===id);if(!x)return;
  openSheet('<div style="text-align:center">'+av(x.n,x.p,'l')+'<h3 style="margin:10px 0 2px">'+E(x.n)+'</h3><p class="muted small">'+E((LANGS[x.l]||{name:''}).name)+' · '+fmt(x.x)+' XP</p></div><button class="sopt" data-act="report" data-id="'+E(id)+'"><span>Report this profile<small>Name or photo is rude or inappropriate</small></span></button><button class="sopt" data-act="block" data-id="'+E(id)+'"><span>Block<small>Hide this learner from your leaderboard</small></span></button><button class="cta alt" data-act="sheetclose" style="margin-top:8px">Close</button>')},
 report(el){const id=el.dataset.id;closeSheet();listSheet('Why are you reporting?',[{v:'abusive name',t:'Rude or abusive name'},{v:'inappropriate photo',t:'Inappropriate photo'},{v:'harassment',t:'Harassment or hate'},{v:'other',t:'Something else'}],'',async why=>{try{await rpc('report_player',{p_player:String(id),p_reason:why})}catch(e){}state.blocked[id]=1;save();toast('Thanks. We will review it, and the profile is hidden for you.');if(!topPage())render()})},
 block(el){state.blocked[el.dataset.id]=1;save();closeSheet();toast('Blocked');render()},
 unblockall(){state.blocked={};save();toast('Unblocked');render()},
 rate(){if(window.PolyAndroid&&PolyAndroid.rate){PolyAndroid.rate();return}window.open(PLAY_URL,'_blank','noopener')},
 async share(){const msg='I am learning Japanese, Korean, Chinese and Thai with PolyLearn.';const url=isNative?PLAY_URL:SITE_URL;
  if(window.PolyAndroid&&PolyAndroid.share){PolyAndroid.share(msg+' '+url);return}
  if(navigator.share){try{await navigator.share({title:'PolyLearn',text:msg,url:url})}catch(e){}return}
  try{await navigator.clipboard.writeText(msg+' '+url);toast('Link copied')}catch(e){toast(url)}},
 uploadphoto(){$('pfFile').click()},
 countrysheet(){listSheet('My country',COUNTRIES.map(c=>({v:c,t:c})),state.country,c=>{state.country=c;save();render()})},
 goalsheet(){listSheet('Daily goal',[1,3,5,10,15].map(n=>({v:n,t:n+' lesson'+(n===1?'':'s')+' a day',s:n===1?'Easy':n===3?'Relaxed':n===5?'Regular':n===10?'Serious':'Intense'})),state.goal,n=>{state.goal=n;save();render()})},
 nativesheet(){listSheet('Language I speak',NATIVES.map(c=>({v:c,t:c})),state.native,c=>{state.native=c;save();render()})},
 resetsheet(){openSheet('<h3>Reset progress?</h3><p class="muted" style="text-align:center;font-weight:700;margin-bottom:14px">This clears your XP, learned words and streak on this device. Your profile and theme stay.</p><button class="cta" style="background:var(--bad);color:#fff" data-act="doreset">Yes, reset</button><button class="cta alt" data-act="sheetclose">Cancel</button>')},
 doreset(){closeSheet();resetProgress();toast('Progress reset');render()},
 sheetclose(){closeSheet()},
 install(){if(installEvt){installEvt.prompt();installEvt=null;render()}}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f){f(el,e)}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.getAttribute&&e.target.getAttribute('role')==='button'&&e.target.dataset.act){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='rateR'){state.rate=parseFloat(t.value)||0.85;const v=$('rateV');if(v)v.textContent=state.rate.toFixed(2)+'×';save()}
 else if(t.id==='pfName'||t.id==='pfBio'){const er=$('pfErr'),bad=badText(t.value);t.classList.toggle('invalid',bad);if(er){er.textContent=bad?'That is not allowed here. Please choose something kind and appropriate.':'';er.classList.toggle('show',bad)}if(!bad){if(t.id==='pfName')state.name=t.value.trim().slice(0,20)||'You';else state.bio=t.value.slice(0,60);save()}}
 else if(t.id==='accPick'){state.accent=t.value;save();applyTheme()}
});
document.addEventListener('change',e=>{if(e.target.classList&&e.target.classList.contains('vsel')){const c=nl(e.target.dataset.lang);if(e.target.value)state.voices[c]=e.target.value;else delete state.voices[c];save();const l=Object.keys(LANGS).map(x=>LANGS[x]).find(x=>nl(x.speech)===c);if(l)speak(l.cats.essentials[0][0],l.speech)}if(e.target.id==='pfFile'){procPhoto(e.target.files[0]);e.target.value=''}if(e.target.id==='accPick'){render()}});
document.addEventListener('keydown',e=>{if(e.target&&e.target.id==='spText'&&e.key==='Enter'){e.preventDefault();spSend(e.target.value.trim())}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(tab==='settings'&&!topPage())render()});

/* ---------- boot ---------- */
const isNative=!!(window.Capacitor||window.PolyAndroid||/PolyLearnApp/.test(navigator.userAgent));
applyTheme();
try{history.replaceState({d:0},'')}catch(e){histOk=false}
render();
if(state.share){syncHook();loadBoard()}
if('serviceWorker' in navigator&&!isNative&&/^https?:/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
document.querySelectorAll('#tabbar .tb').forEach(b=>{b.innerHTML=IC[{home:'home',stats:'stats',board:'trophy',speak:'chat',settings:'gear'}[b.dataset.t]]});
if(badText(state.name)){state.name='You';save()}
if(badText(state.bio)){state.bio='';save()}
state.photo=(/^data:image\//.test(state.photo||''))?state.photo:'';
if(auth)cloudPull();

})();</script></body></html>
