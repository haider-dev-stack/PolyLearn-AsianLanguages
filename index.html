<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PolyLearn — East Asian Languages</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235b4de0'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Ctext x='50' y='73' font-size='64' text-anchor='middle' fill='white' font-family='sans-serif'%3E学%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#ecebff;--card:#fff;--ink:#1f2142;--mute:#6b6e8f;--pri:#5b4de0;--pri2:#8b5cf6;--soft:#f3f0ff;--line:#e3e1f7;--ok:#16a34a;--bad:#dc2626;--gold:#f5b301}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP","Noto Sans KR","Noto Sans SC",sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--card);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 24px;position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px}
.logo b{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
nav{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer}
.nv,.chip,.btn,.opt{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-weight:700}
.nv{border:0;background:none;display:flex;align-items:center;gap:8px}
.nv.on,.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.pill{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-weight:700;font-size:14px;margin-left:6px}
main{max-width:980px;margin:0 auto;padding:24px 16px 60px}
.eyebrow{color:var(--pri);font-weight:800;letter-spacing:.12em;font-size:12px;text-transform:uppercase}
h1{font-size:clamp(34px,7vw,56px);margin:6px 0 10px;line-height:1.05;letter-spacing:-.03em}
h2{margin:0;font-size:21px}
.sub{color:var(--mute);font-size:14px}
.card{background:var(--card);border-radius:24px;padding:22px;box-shadow:0 8px 30px rgba(91,77,224,.08);margin:18px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:18px 0}
.lang{background:var(--card);border:2px solid transparent;border-radius:22px;padding:20px;text-align:left}
.lang.on{border-color:var(--pri);background:var(--soft)}
.lang small{display:block;letter-spacing:.1em;font-size:20px;margin-bottom:14px}
.lang b{display:block}.lang span{color:var(--mute);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{padding:8px 14px;font-size:14px}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0}
.ph{background:var(--soft);border-radius:20px;padding:24px;text-align:center;margin-top:14px}
.big{font-size:clamp(34px,8vw,52px);font-weight:700;margin:6px 0}
.mid{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.opt{display:block;width:100%;text-align:left;margin-top:8px;border-radius:14px}
.opt.ok{background:#dcfce7;border-color:var(--ok)}.opt.bad{background:#fee2e2;border-color:var(--bad)}
input[type=text],textarea,select{width:100%;font:inherit;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink)}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
.fb{font-weight:700;margin-top:10px}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.flash{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-radius:20px;padding:40px 20px;text-align:center;cursor:pointer;margin-top:14px}
.pb li{display:flex;gap:12px;justify-content:space-between;padding:11px 4px;border-top:1px solid var(--line);list-style:none}
.pb{padding:0;margin:10px 0 0}.pb b{font-size:18px}.pb span{color:var(--mute);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.stat{background:var(--soft);border-radius:16px;padding:14px;text-align:center}.stat b{display:block;font-size:24px}.stat span{color:var(--mute);font-size:13px}
.bar{height:8px;background:var(--line);border-radius:9px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.ms{background:var(--soft);border-radius:16px;padding:14px}
.ach{border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}.ach.off{opacity:.45}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;display:inline-grid;place-items:center;color:#fff;font-weight:800;flex:none}
.av.s{width:30px;height:30px;font-size:14px}.av.m{width:54px;height:54px;font-size:22px}.av.l{width:104px;height:104px;font-size:44px}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end;margin:22px 0 10px}
.pod{text-align:center;background:var(--soft);border-radius:18px;padding:14px 6px}.pod.p1{padding:26px 6px;border:2px solid var(--gold)}
.pod .nm{font-weight:800;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pod .x{color:var(--pri);font-weight:800;font-size:14px}
.lb{list-style:none;margin:0;padding:0}.lb li{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:14px}
.lb li+li{border-top:1px solid var(--line)}.lb li.me{background:var(--soft);border:2px solid var(--pri)}
.rk{width:28px;text-align:center;font-weight:800;color:var(--mute)}.lb .nm{flex:1;font-weight:700;min-width:0}
.tag{background:var(--soft);color:var(--pri);border-radius:8px;padding:2px 7px;font-size:12px;font-weight:800;margin-left:6px}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.hero p{margin:4px 0;color:var(--mute)}
.hide{display:none}.note{color:var(--mute);font-size:13px;margin-top:12px}
@media(max-width:560px){header{padding:10px 14px}}
</style>
</head>
<body>
<header>
  <div class="logo"><b>学</b>PolyLearn</div>
  <nav id="nav"></nav>
  <div><span class="pill" id="hx"></span><span class="pill" id="hs"></span></div>
</header>
<main id="app"></main>
<input type="file" id="file" accept="image/*" class="hide">

<script>
const $=i=>document.getElementById(i);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const SIT=['Essentials','Meeting people','At a restaurant','Getting around','Shopping','At the hotel','Emergencies & health'];
const EN=`Hello;Thank you;Sorry / Excuse me;Nice to meet you;My name is…;Do you speak English?;A table for two, please;The bill, please;It's delicious;Where is the station?;Where is the toilet?;How much is the ticket?;How much is this?;It's too expensive;I'll take it;I have a reservation;What time is checkout?;What's the Wi-Fi password?;Help!;Call an ambulance;I need a doctor`.split(';');
const D={
JP:{n:'Japanese',o:'日本語',v:'ja-JP',p:`こんにちは|konnichiwa;ありがとう|arigatō;すみません|sumimasen;はじめまして|hajimemashite;私は…です|watashi wa … desu;英語を話せますか|eigo o hanasemasu ka;二人お願いします|futari onegai shimasu;お会計お願いします|okaikei onegai shimasu;おいしいです|oishii desu;駅はどこですか|eki wa doko desu ka;トイレはどこですか|toire wa doko desu ka;切符はいくらですか|kippu wa ikura desu ka;いくらですか|ikura desu ka;高すぎます|takasugimasu;これをください|kore o kudasai;予約しています|yoyaku shiteimasu;チェックアウトは何時ですか|chekkuauto wa nanji desu ka;Wi-Fiのパスワードは？|wai-fai no pasuwādo wa;助けて|tasukete;救急車を呼んでください|kyūkyūsha o yonde kudasai;医者が必要です|isha ga hitsuyō desu`},
CN:{n:'Mandarin Chinese',o:'中文（普通话）',v:'zh-CN',p:`你好|nǐ hǎo;谢谢|xièxie;对不起|duìbuqǐ;很高兴认识你|hěn gāoxìng rènshi nǐ;我叫…|wǒ jiào …;你会说英语吗？|nǐ huì shuō yīngyǔ ma;请给我两个位子|qǐng gěi wǒ liǎng gè wèizi;请结账|qǐng jiézhàng;很好吃|hěn hǎochī;火车站在哪里？|huǒchēzhàn zài nǎlǐ;厕所在哪里？|cèsuǒ zài nǎlǐ;票多少钱？|piào duōshao qián;这个多少钱？|zhège duōshao qián;太贵了|tài guì le;我要这个|wǒ yào zhège;我有预订|wǒ yǒu yùdìng;几点退房？|jǐ diǎn tuìfáng;Wi-Fi密码是什么？|Wi-Fi mìmǎ shì shénme;救命|jiùmìng;请叫救护车|qǐng jiào jiùhùchē;我需要看医生|wǒ xūyào kàn yīshēng`},
HK:{n:'Cantonese',o:'廣東話',v:'zh-HK',p:`你好|nei5 hou2;多謝|do1 ze6;對唔住|deoi3 m4 zyu6;好高興認識你|hou2 gou1 hing3 jing6 sik1 nei5;我叫…|ngo5 giu3 …;你識唔識講英文？|nei5 sik1 m4 sik1 gong2 jing1 man2;麻煩兩位|maa4 faan4 loeng5 wai2;唔該埋單|m4 goi1 maai4 daan1;好好食|hou2 hou2 sik6;火車站喺邊度？|fo2 ce1 zaam6 hai2 bin1 dou6;廁所喺邊度？|ci3 so2 hai2 bin1 dou6;張票幾多錢？|zoeng1 piu3 gei2 do1 cin2;呢個幾多錢？|ni1 go3 gei2 do1 cin2;太貴喇|taai3 gwai3 laa3;我要呢個|ngo5 jiu3 ni1 go3;我有訂房|ngo5 jau5 deng6 fong2;幾點退房？|gei2 dim2 teoi3 fong2;Wi-Fi密碼係乜嘢？|Wi-Fi mat6 maa5 hai6 mat1 je5;救命|gau3 meng6;請叫救護車|ceng2 giu3 gau3 wu6 ce1;我要睇醫生|ngo5 jiu3 tai2 ji1 sang1`},
KR:{n:'Korean',o:'한국어',v:'ko-KR',p:`안녕하세요|annyeonghaseyo;감사합니다|gamsahamnida;죄송합니다|joesonghamnida;만나서 반갑습니다|mannaseo bangapseumnida;제 이름은 …입니다|je ireumeun … imnida;영어 하세요?|yeongeo haseyo;두 명이요|du myeong-iyo;계산해 주세요|gyesanhae juseyo;맛있어요|masisseoyo;역이 어디예요?|yeogi eodiyeyo;화장실이 어디예요?|hwajangsiri eodiyeyo;표가 얼마예요?|pyoga eolmayeyo;이거 얼마예요?|igeo eolmayeyo;너무 비싸요|neomu bissayo;이거 주세요|igeo juseyo;예약했어요|yeyakhaesseoyo;체크아웃은 몇 시예요?|chekeuauseun myeot siyeyo;와이파이 비밀번호가 뭐예요?|waipai bimilbeonhoga mwoyeyo;도와주세요|dowajuseyo;구급차 불러 주세요|gugeupcha bulleo juseyo;의사가 필요해요|uisaga piryohaeyo`}};
for(const k in D)D[k].p=D[k].p.split(';').map(x=>x.split('|'));
const RIV=[['Haruka','JP',1840],['Wei Lin','CN',1610],['Min-jun','KR',1475],['Siu Ming','HK',1320],['Sofia','JP',1105],['Jae','KR',960],['Anna','CN',790],['Tom','HK',640],['Priya','JP',455],['Leo','KR',280]];
const ACH=[['First steps','Earn your first 10 XP',s=>s.xp>=10],['Word collector','Master 5 phrases',s=>mc()>=5],['Quiz whiz','Get 10 answers correct',s=>s.correct>=10],['Habit builder','Study on 3 different days',s=>s.days.length>=3]];

const def={xp:0,mastered:{},correct:0,answered:0,days:[],log:{},day:{d:'',studied:0,correct:0,xp:0},lang:'JP',sit:null,pos:0,rate:.9,name:'You',bio:'',native:'English',photo:'',joined:today()};
let s;try{s=Object.assign({},def,JSON.parse(localStorage.getItem('polylearn_v2')||'{}'))}catch(e){s={...def}}
const save=()=>{try{localStorage.setItem('polylearn_v2',JSON.stringify(s))}catch(e){}};
let view='learn',hid=0,pm='mc',q=null,bp='week',bl='ALL',ed=0,tp=null;

const mc=()=>Object.keys(s.mastered).length;
const dy=()=>{if(s.day.d!==today())s.day={d:today(),studied:0,correct:0,xp:0};return s.day};
const lst=()=>EN.map((_,i)=>i).filter(i=>s.sit===null||Math.floor(i/3)===s.sit);
const ph=i=>({t:D[s.lang].p[i][0],r:D[s.lang].p[i][1],e:EN[i]});
function addXp(n){s.xp+=n;dy().xp+=n;const d=today();s.log[d]=(s.log[d]||0)+n;if(!s.days.includes(d))s.days.push(d)}
function streak(){let n=0,d=new Date();if(!s.days.includes(d.toISOString().slice(0,10)))d.setDate(d.getDate()-1);while(s.days.includes(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}return n}
function weekXp(){let t=0,d=new Date();for(let i=0;i<7;i++){t+=s.log[d.toISOString().slice(0,10)]||0;d.setDate(d.getDate()-1)}return t}
const acc=()=>s.answered?Math.round(100*s.correct/s.answered):0;
const hue=n=>[...n].reduce((a,c)=>a+c.charCodeAt(0),0)*37%360;
const av=(n,p,c='')=>p?`<img class="av ${c}" src="${p}" alt="${esc(n)}">`:`<span class="av ${c}" style="background:hsl(${hue(n)} 55% 48%)">${esc((n.trim()[0]||'?').toUpperCase())}</span>`;
function say(i){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(D[s.lang].p[i][0]);u.lang=D[s.lang].v;u.rate=s.rate;speechSynthesis.speak(u)}catch(e){}}
function newQ(){const L=lst(),i=L[Math.floor(Math.random()*L.length)],pool=EN.map((_,k)=>k).filter(k=>k!==i),o=[i];while(o.length<4)o.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);o.sort(()=>Math.random()-.5);q={i,o,pick:null,res:null,hint:0,fl:0,val:''}}
function mark(ok){s.answered++;if(ok){s.correct++;dy().correct++;addXp(5)}}
const norm=x=>x.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();

function learn(){
  const L=lst();if(s.pos>=L.length)s.pos=0;const i=L[s.pos],p=ph(i),d=dy();
  if(!q)newQ();const pq=ph(q.i);
  const done=L.filter(k=>s.mastered[s.lang+k]).length;
  let pr='';
  if(pm==='mc')pr=`<p class="sub" style="margin-top:14px">Choose the correct meaning</p><div class="big">${esc(pq.t)}</div>`+q.o.map(k=>`<button class="opt ${q.res?(k===q.i?'ok':k===q.pick?'bad':''):''}" data-a="mc" data-v="${k}">${esc(EN[k])}</button>`).join('');
  else if(pm==='type')pr=`<p class="sub" style="margin-top:14px">Type the translation (in English)</p><div class="big">${esc(pq.t)}</div><input type="text" id="ans" autocomplete="off" placeholder="Your answer" value="${esc(q.val)}" ${q.res?'disabled':''}><div class="mid"><button class="btn pri" data-a="check">Check answer</button><button class="btn" data-a="hint">Show hint</button></div>${q.hint?`<p class="sub">Hint: ${esc(EN[q.i].split(' ').map(w=>w[0]+'…').join(' '))}</p>`:''}`;
  else pr=`<div class="flash" data-a="flip"><div class="sub" style="color:#e0daff">TAP TO FLIP</div><div class="big">${q.fl?esc(EN[q.i]):esc(pq.t)}</div><div>${q.fl?'':esc(pq.r)}</div></div><div class="mid"><button class="btn" data-a="flip">Flip card</button></div>`;
  if(pm!=='flash'&&q.res)pr+=`<div class="fb ${q.res}">${q.res==='ok'?'Correct! +5 XP':'Not quite. Answer: '+esc(EN[q.i])}</div>`;
  pr+=`<div class="mid"><button class="btn" data-a="nq">${pm==='flash'?'Next card →':'New question ↻'}</button></div>`;
  const ms=[['Study 5 phrases',d.studied,5],['Answer 3 questions correctly',d.correct,3],['Earn 30 XP',d.xp,30]];
  return `<div class="eyebrow">Your language adventure</div><h1>Small lessons.<br>Big progress.</h1>
  <p class="sub" style="max-width:640px;font-size:16px">Learn useful words and real-life phrases, practise with quick quizzes, and build a daily habit. Choose a language, then pick a situation.</p>
  <div class="grid">${Object.entries(D).map(([k,v])=>`<button class="lang ${k===s.lang?'on':''}" data-a="lang" data-v="${k}"><small>${k}</small><b>${v.n}</b><span>${v.o}</span></button>`).join('')}</div>
  <div class="card"><h2>Choose a situation</h2><div class="sub">Focus your lessons, quizzes and phrasebook on one scenario</div>
  <div class="row"><button class="chip ${s.sit===null?'on':''}" data-a="sit" data-v="">All phrases · 21</button>${SIT.map((t,k)=>`<button class="chip ${s.sit===k?'on':''}" data-a="sit" data-v="${k}">${t} · 3</button>`).join('')}</div></div>
  <div class="card"><h2>Daily lesson</h2><div class="sub">${s.pos+1} / ${L.length}</div>
  <div class="ph"><div class="eyebrow">Learn this phrase</div><div class="big">${esc(p.t)}</div><div class="sub">${esc(p.r)}</div><div style="font-size:22px;font-weight:700;margin-top:8px">${hid?'• • •':esc(p.e)}</div>
  <div class="mid"><button class="btn" data-a="hide">${hid?'Show':'Hide'} meaning</button><button class="btn" data-a="say" data-v="${i}">🔊 Listen</button><button class="btn pri" data-a="know">✓ I know this</button></div></div>
  <div class="mid"><button class="btn" data-a="prev">← Back</button><span class="sub" style="align-self:center">${done} of ${L.length} words practised</span><button class="btn" data-a="next">Next →</button></div></div>
  <div class="card"><h2>Practice zone</h2><div class="sub">Test your memory and build confidence</div>
  <div class="row">${[['mc','Multiple choice'],['type','Type the answer'],['flash','Flashcards']].map(([k,t])=>`<button class="chip ${pm===k?'on':''}" data-a="mode" data-v="${k}">${t}</button>`).join('')}</div>${pr}</div>
  <div class="card"><h2>Phrasebook</h2><div class="sub">${L.length} phrases</div><ul class="pb">${L.map(k=>{const x=ph(k);return `<li><div><b>${esc(x.t)}</b><br><span>${esc(x.r)} — ${esc(x.e)}</span></div><button class="btn" data-a="say" data-v="${k}">🔊</button></li>`}).join('')}</ul></div>
  <div class="card"><h2>Daily missions</h2><div class="grid">${ms.map(([t,v,m])=>`<div class="ms"><b>${t}</b><div class="sub">${Math.min(v,m)} / ${m}</div><div class="bar"><i style="width:${Math.min(100,100*v/m)}%"></i></div></div>`).join('')}</div></div>
  <div class="card"><h2>Achievements</h2><div class="grid">${ACH.map(([t,d,f])=>`<div class="ach ${f(s)?'':'off'}"><div style="font-size:26px">${f(s)?'🏅':'🔒'}</div><b>${t}</b><div class="sub">${d}</div></div>`).join('')}</div></div>
  <div class="card"><h2>Settings</h2><label for="rate">Speaking speed</label><input type="range" id="rate" min="0.5" max="1.2" step="0.1" value="${s.rate}" style="width:100%"><p class="note">Uses your browser's text-to-speech voice if available. Progress is saved in this browser on this device.</p><button class="btn" data-a="reset">Reset all progress</button></div>`;
}

function rows(){
  const m=bp==='week'?1:3.4;
  const r=RIV.filter(x=>bl==='ALL'||x[1]===bl).map(x=>({n:x[0],l:x[1],x:Math.round(x[2]*m)}));
  r.push({n:s.name,l:s.lang,x:bp==='week'?weekXp():s.xp,me:1,p:s.photo});
  return r.sort((a,b)=>b.x-a.x);
}
function board(){
  const r=rows(),med=['🥇','🥈','🥉'],top=r.slice(0,3);
  return `<div class="eyebrow">Learn together</div><h1>Climb the ranks.</h1>
  <div class="card"><h2>Gold League</h2><div class="sub">Top 3 move up when the week ends</div>
  <div class="row">${[['week','This week'],['all','All time']].map(([k,t])=>`<button class="chip ${bp===k?'on':''}" data-a="bp" data-v="${k}">${t}</button>`).join('')}</div>
  <div class="row">${[['ALL','All languages'],...Object.entries(D).map(([k,v])=>[k,v.n])].map(([k,t])=>`<button class="chip ${bl===k?'on':''}" data-a="bl" data-v="${k}">${t}</button>`).join('')}</div>
  <div class="podium">${[1,0,2].filter(i=>top[i]).map(i=>`<div class="pod p${i+1}"><div style="font-size:22px">${med[i]}</div>${av(top[i].n,top[i].p,'m')}<div class="nm">${esc(top[i].n)}${top[i].me?' (you)':''}</div><div class="x">${top[i].x.toLocaleString()} XP</div></div>`).join('')}</div>
  <ul class="lb">${r.slice(3).map((x,i)=>`<li class="${x.me?'me':''}"><span class="rk">${i+4}</span>${av(x.n,x.p)}<span class="nm">${esc(x.n)}${x.me?' (you)':''}<span class="tag">${x.l}</span></span><b>${x.x.toLocaleString()} XP</b></li>`).join('')}</ul>
  <p class="note">Other learners are sample data. A live leaderboard across real users needs a shared backend. Earn XP in lessons and quizzes to climb.</p></div>`;
}

function profile(){
  const rk=rows().findIndex(x=>x.me)+1;
  if(ed)return `<div class="eyebrow">Your profile</div><h1>Edit profile</h1><div class="card">
  <label>Profile picture</label><div class="hero"><span id="pv">${av(s.name,tp===null?s.photo:tp,'l')}</span><div><button class="btn pri" data-a="pick">Upload photo</button> <button class="btn" data-a="rmphoto">Remove</button><p class="sub">JPG, PNG or WebP. It's cropped to a square and saved only in this browser.</p></div></div>
  <label for="fn">Display name</label><input type="text" id="fn" maxlength="20" value="${esc(s.name)}">
  <label for="fb">About me</label><textarea id="fb" rows="2" maxlength="90" placeholder="Why are you learning?">${esc(s.bio)}</textarea>
  <label for="fl">Native language</label><select id="fl">${['English','Spanish','French','German','Portuguese','Arabic','Hindi','Other'].map(l=>`<option ${l===s.native?'selected':''}>${l}</option>`).join('')}</select>
  <div class="row"><button class="btn pri" data-a="save">Save</button><button class="btn" data-a="cancel">Cancel</button></div></div>`;
  return `<div class="eyebrow">Your profile</div><h1>${esc(s.name)}</h1><div class="card"><div class="hero">${av(s.name,s.photo,'l')}<div style="flex:1;min-width:200px"><h2>${esc(s.name)}</h2><p>${esc(s.bio)||'Add a short bio and upload a photo to personalise your profile.'}</p><p>Native: ${esc(s.native)} · Learning ${D[s.lang].n} · Joined ${s.joined}</p></div><button class="btn" data-a="edit">✏️ Edit profile</button></div>
  <div class="stats"><div class="stat"><b>${s.xp.toLocaleString()}</b><span>Total XP</span></div><div class="stat"><b>#${rk}</b><span>League rank</span></div><div class="stat"><b>${streak()}</b><span>Day streak</span></div><div class="stat"><b>${mc()}</b><span>Phrases mastered</span></div><div class="stat"><b>${acc()}%</b><span>Quiz accuracy</span></div></div></div>
  <div class="card"><h2>Achievements</h2><div class="grid">${ACH.map(([t,d,f])=>`<div class="ach ${f(s)?'':'off'}"><div style="font-size:26px">${f(s)?'🏅':'🔒'}</div><b>${t}</b><div class="sub">${d}</div></div>`).join('')}</div></div>`;
}

function render(){
  $('nav').innerHTML=[['learn','Learn'],['board','Leaderboard'],['profile','Profile']].map(([k,t])=>`<button class="nv ${view===k?'on':''}" data-a="view" data-v="${k}">${k==='profile'?av(s.name,s.photo,'s')+' ':''}${t}</button>`).join('');
  $('hx').textContent='⚡ '+s.xp+' XP';$('hs').textContent='🔥 '+streak()+' day streak';
  $('app').innerHTML=view==='learn'?learn():view==='board'?board():profile();
}

function act(a,v){
  const L=lst();
  if(a==='say'){say(+v);return}
  if(a==='pick'){$('file').click();return}
  if(a==='view'){view=v;ed=0;window.scrollTo(0,0)}
  else if(a==='lang'){s.lang=v;s.sit=null;s.pos=0;q=null}
  else if(a==='sit'){s.sit=v===''?null:+v;s.pos=0;q=null}
  else if(a==='next'){s.pos=(s.pos+1)%L.length;hid=0}
  else if(a==='prev'){s.pos=(s.pos-1+L.length)%L.length;hid=0}
  else if(a==='hide')hid=!hid;
  else if(a==='know'){const k=s.lang+L[s.pos];if(!s.mastered[k]){s.mastered[k]=1;addXp(10)}dy().studied++;s.pos=(s.pos+1)%L.length;hid=0}
  else if(a==='mode'){pm=v;q=null}
  else if(a==='mc'){if(q.res)return;q.pick=+v;q.res=q.pick===q.i?'ok':'bad';mark(q.res==='ok')}
  else if(a==='check'){if(q.res)return;q.val=$('ans').value;if(!q.val.trim())return;q.res=norm(q.val)===norm(EN[q.i])?'ok':'bad';mark(q.res==='ok')}
  else if(a==='hint')q.hint=1;
  else if(a==='flip')q.fl=!q.fl;
  else if(a==='nq')q=null;
  else if(a==='bp')bp=v;
  else if(a==='bl')bl=v;
  else if(a==='edit'){ed=1;tp=null}
  else if(a==='cancel')ed=0;
  else if(a==='rmphoto'){tp='';$('pv').innerHTML=av($('fn').value||s.name,'','l');return}
  else if(a==='save'){s.name=$('fn').value.trim()||'You';s.bio=$('fb').value.trim();s.native=$('fl').value;if(tp!==null)s.photo=tp;ed=0}
  else if(a==='reset'){if(confirm('Reset all progress? Your profile is kept.')){const k={name:s.name,bio:s.bio,native:s.native,photo:s.photo,joined:s.joined};s=Object.assign({},def,k);q=null}}
  save();render();
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.v)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ans')act('check')});
document.addEventListener('input',e=>{if(e.target.id==='rate'){s.rate=+e.target.value;save()}});
$('file').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f||!f.type.startsWith('image/'))return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const c=document.createElement('canvas'),z=160;c.width=c.height=z;
    const m=Math.min(im.width,im.height);
    c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,z,z);
    tp=c.toDataURL('image/jpeg',.82);
    if($('pv'))$('pv').innerHTML=av(s.name,tp,'l');
  };im.src=r.result};
  r.readAsDataURL(f);
});
render();
</script>
</body>
</html>
